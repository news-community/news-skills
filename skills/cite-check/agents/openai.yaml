# Catalog presentation: the name and summary a skill registry shows in its listing.
# SKILL.md's `description` is the agent's trigger and stays written for that job;
# this file is written for the person browsing a catalog. Limits (ClawHub):
# display_name 120 characters, short_description 300. Tests hold both.
interface:
  display_name: "Cite Check: Verify Quotes Against Meeting Transcripts and Local News, With Citations"
  short_description: >-
    Check the quotes in a draft against a local newsroom's meeting transcripts and articles:
    verbatim, close or not found, with speaker checks and citations with backlinks. Sends only
    the quoted words. Read-only. Communities News platform; live for Alaska News.
