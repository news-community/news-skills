name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Declared explicitly rather than inherited. The repo default is already `read`,
# but once this is public a fork's pull request runs this workflow, and a default
# that lives in a settings page can be changed without touching the file that
# depends on it. Nothing here writes, so nothing here needs write.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite was run locally on 3.11, 3.13 and 3.14. 3.9 is in this matrix
        # to TEST the claimed floor, not to restate it: the one version-sensitive
        # branch is socket.timeout vs TimeoutError, which are the same class only
        # from 3.10, and CI is the first thing that actually exercises 3.9.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Run the offline suite
        run: python -m pytest skills/news-desk/scripts/test_news_desk.py -q
      - name: The read-only contract, checked without importing anything
        # A grep, not a test: if the module ever fails to import, the in-suite
        # version of this check would be skipped rather than failed.
        run: |
          ! grep -nE '"(PATCH|PUT|DELETE)"' skills/news-desk/scripts/news_desk.py
